<!DOCTYPE html>
<html lang="en" class="dark" data-theme="cyber-neon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Institutional Placement Eligibility and Scheduling Engine - Corporate Recruitment SaaS Platform" />
    <title>Placement Engine | Corporate Recruitment SaaS</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        font-family: 'Inter', sans-serif;
      }
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #060B16;
        color: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register local offline service worker and immediately force update
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            if (reg) reg.update();
          }).catch((err) => {
            console.log('Local SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
